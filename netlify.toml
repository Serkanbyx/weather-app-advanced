# Netlify Configuration File
# This file tells Netlify how the project should be built and run

[build]
  # Build command - production build with Vite
  command = "npm run build"
  
  # Build output directory
  publish = "dist"
  
  # Functions directory
  functions = "netlify/functions"

[functions]
  # Node.js bundler for TypeScript functions
  node_bundler = "esbuild"

# Local proxy settings for development
# port = the port Netlify Dev runs on (the one you open in the browser)
# targetPort = the port Vite runs on
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  autoLaunch = true

# API proxy - redirect to Netlify Functions (MUST COME FIRST!)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA routing - redirect all routes to index.html (AFTER the API proxy)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
